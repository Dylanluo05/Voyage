<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voyage — Plan trips with friends, earn XP on sidequests</title>
    <meta name="description" content="Voyage is a free trip planner for friends: build itineraries together, split expenses, get AI help, and take on photo-verified sidequests to earn XP wherever you travel." />
    <link rel="canonical" href="https://voyagetravel.app/" />
    <meta name="theme-color" content="#0b76dd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voyage" />
    <meta property="og:title" content="Voyage — Plan trips with friends, earn XP on sidequests" />
    <meta property="og:description" content="Build itineraries together, split expenses, get AI help, and take on photo-verified sidequests wherever you travel." />
    <meta property="og:url" content="https://voyagetravel.app/" />
    <meta property="og:image" content="https://voyagetravel.app/og-image.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voyage — Plan trips with friends, earn XP on sidequests" />
    <meta name="twitter:description" content="Build itineraries together, split expenses, get AI help, and take on photo-verified sidequests wherever you travel." />
    <meta name="twitter:image" content="https://voyagetravel.app/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Voyage",
        "url": "https://voyagetravel.app/",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "description": "Collaborative trip planner with expense splitting, an AI travel assistant, and photo-verified sidequests.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      (function () {
        var t = localStorage.getItem('voyage-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800,701,801&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
